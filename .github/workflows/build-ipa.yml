name: Build IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Build unsigned
        run: |
          xcodebuild \
            -project TheThangMay.xcodeproj \
            -scheme TheThangMay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/TheThangMay.app dist/Payload/
          cd dist
          zip -qry TheThangMay-unsigned.ipa Payload
          ls -lh TheThangMay-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheThangMay-unsigned-ipa
          path: dist/TheThangMay-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
