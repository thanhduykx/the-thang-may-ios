# Dự phòng: tạo lại project bằng XcodeGen nếu file .xcodeproj không mở được.
#   brew install xcodegen
#   cd TheThangMay
#   xcodegen generate
name: TheThangMay

options:
  bundleIdPrefix: com.duong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  TheThangMay:
    type: application
    platform: iOS
    sources:
      - path: TheThangMay
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duong.thethangmay
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TheThangMay/Info.plist
        CODE_SIGN_ENTITLEMENTS: TheThangMay/TheThangMay.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: TheThangMay/Info.plist
      properties:
        CFBundleDisplayName: Thẻ Thang Máy
        NFCReaderUsageDescription: Đọc thẻ nhà để lưu vào ví điện tử của bạn.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: TheThangMay/TheThangMay.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG
